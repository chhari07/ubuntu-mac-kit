# GNOME settings applied by install.sh, one per line: <schema> <key> <value>
# Values use GVariant syntax, exactly as `gsettings get` prints them.
# The original value of every key is saved before it is changed and restored by uninstall.sh.

org.gnome.desktop.interface icon-theme 'WhiteSur-dark'
org.gnome.desktop.interface cursor-theme 'macOS'
org.gnome.desktop.interface gtk-theme 'Yaru-blue-dark'
org.gnome.desktop.interface color-scheme 'prefer-dark'
org.gnome.desktop.wm.preferences button-layout 'close,minimize,maximize:'

org.gnome.shell.extensions.dash-to-dock dock-position 'BOTTOM'
org.gnome.shell.extensions.dash-to-dock extend-height false
org.gnome.shell.extensions.dash-to-dock transparency-mode 'FIXED'
org.gnome.shell.extensions.dash-to-dock background-opacity 0.3
org.gnome.shell.extensions.dash-to-dock dash-max-icon-size 48
